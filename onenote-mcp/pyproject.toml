[project]
name = "onenote-mcp"
version = "0.1.0"
description = "Local, read-only MCP server for Microsoft OneNote via Microsoft Graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "markdown-it-py>=3",
    "markdownify>=1.0",
    "mcp>=2.3,<3",
    "msal>=1.31",
    "pydantic>=2",
]

[project.scripts]
onenote-mcp = "onenote_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
